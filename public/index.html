<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Personal Chat</title>

    <!-- Favicon -->
    <link
        rel="icon"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🤖%3C/text%3E%3C/svg%3E"
    >

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(
                135deg,
                #0f172a,
                #111827,
                #1e1b4b
            );
            color: white;
        }

        .app {
            display: flex;
            min-height: 100vh;
        }

        /* ================= SIDEBAR ================= */

        .sidebar {
            width: 280px;
            padding: 25px;
            background: rgba(0, 0, 0, 0.25);
            border-right: 1px solid rgba(255, 255, 255, 0.1);
        }

        .sidebar h2 {
            margin-top: 0;
            margin-bottom: 25px;
            font-size: 22px;
        }

        .persona {
            width: 100%;
            padding: 14px;
            margin-bottom: 10px;

            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 12px;

            background: rgba(255,255,255,0.07);
            color: white;

            cursor: pointer;
            text-align: left;

            font-size: 15px;

            transition: 0.2s;
        }

        .persona:hover {
            background: rgba(255,255,255,0.14);
            transform: translateX(2px);
        }

        .persona.active {
            background: linear-gradient(
                135deg,
                #4f46e5,
                #7c3aed
            );

            border-color: transparent;
        }

        .clear {
            width: 100%;
            padding: 13px;

            margin-top: 20px;

            border: none;
            border-radius: 12px;

            background: #dc2626;
            color: white;

            cursor: pointer;

            font-size: 14px;

            transition: 0.2s;
        }

        .clear:hover {
            background: #b91c1c;
        }

        /* ================= MAIN ================= */

        .main {
            flex: 1;

            display: flex;
            flex-direction: column;

            width: 100%;
            max-width: 1100px;

            margin: auto;

            padding: 30px;
        }

        .title {
            text-align: center;

            font-size: 42px;
            font-weight: 800;

            margin-bottom: 5px;
        }

        .subtitle {
            text-align: center;

            color: #a5b4fc;

            font-size: 17px;

            margin-bottom: 15px;
        }

        .mode {
            text-align: center;

            color: #c4b5fd;

            font-size: 14px;

            margin-bottom: 20px;
        }

        /* ================= CHAT ================= */

        .chat {
            flex: 1;

            min-height: 450px;
            max-height: calc(100vh - 230px);

            overflow-y: auto;

            padding: 25px;

            background: rgba(255,255,255,0.04);

            border: 1px solid rgba(255,255,255,0.08);

            border-radius: 20px;

            scrollbar-width: thin;
        }

        .welcome {
            height: 100%;

            display: flex;
            align-items: center;
            justify-content: center;

            text-align: center;

            color: #94a3b8;

            font-size: 16px;
        }

        /* ================= MESSAGES ================= */

        .message {
            max-width: 75%;

            padding: 14px 18px;

            margin: 12px 0;

            border-radius: 18px;

            line-height: 1.5;

            white-space: pre-wrap;

            word-wrap: break-word;
        }

        .user {
            margin-left: auto;

            background: linear-gradient(
                135deg,
                #4f46e5,
                #7c3aed
            );

            border-radius: 18px 18px 4px 18px;
        }

        .bot {
            margin-right: auto;

            background: rgba(255,255,255,0.09);

            border: 1px solid rgba(255,255,255,0.08);

            border-radius: 18px 18px 18px 4px;
        }

        .name {
            font-size: 11px;

            font-weight: 700;

            opacity: 0.65;

            margin-bottom: 6px;
        }

        /* ================= INPUT ================= */

        .input-area {
            display: flex;

            gap: 10px;

            margin-top: 15px;
        }

        #messageInput {
            flex: 1;

            padding: 15px 18px;

            border: 1px solid rgba(255,255,255,0.15);

            border-radius: 12px;

            background: rgba(255,255,255,0.08);

            color: white;

            outline: none;

            font-size: 15px;
        }

        #messageInput:focus {
            border-color: #6366f1;
        }

        #messageInput::placeholder {
            color: #94a3b8;
        }

        #send {
            padding: 0 25px;

            border: none;

            border-radius: 12px;

            background: #4f46e5;

            color: white;

            cursor: pointer;

            font-size: 15px;

            font-weight: 600;

            transition: 0.2s;
        }

        #send:hover {
            background: #4338ca;
        }

        #send:disabled {
            opacity: 0.5;

            cursor: not-allowed;
        }

        /* ================= MOBILE ================= */

        @media (max-width: 700px) {

            .app {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;

                border-right: none;

                border-bottom: 1px solid rgba(255,255,255,0.1);

                padding: 15px;
            }

            .sidebar h2 {
                font-size: 18px;
                margin-bottom: 12px;
            }

            .persona {
                width: 49%;

                display: inline-block;

                margin-right: 1%;
            }

            .clear {
                margin-top: 10px;
            }

            .main {
                padding: 15px;
            }

            .title {
                font-size: 30px;
            }

            .subtitle {
                font-size: 14px;
            }

            .chat {
                min-height: 400px;
            }

            .message {
                max-width: 90%;
            }

        }

    </style>
</head>


<body>

<div class="app">

    <!-- ================= SIDEBAR ================= -->

    <aside class="sidebar">

        <h2>🎭 Choose Your Mode</h2>


        <button
            class="persona active"
            onclick="selectMode(this, 'you are an ai teacher')"
        >
            👨‍🏫 AI Teacher
        </button>


        <button
            class="persona"
            onclick="selectMode(this, 'you are a friend')"
        >
            🤝 Friend
        </button>


        <button
            class="persona"
            onclick="selectMode(this, 'you are an angry person')"
        >
            😡 Angry Person
        </button>


        <button
            class="persona"
            onclick="selectMode(this, 'you are a sad person')"
        >
            😢 Sad Person
        </button>


        <button
            class="clear"
            onclick="clearChat()"
        >
            🗑️ Clear Conversation
        </button>

    </aside>


    <!-- ================= MAIN ================= -->

    <main class="main">


        <div class="title">
            🤖 AI Personal Chat
        </div>


        <div class="subtitle">
            Choose your AI personality and start chatting
        </div>


        <div
            class="mode"
            id="currentMode"
        >
            Current Mode: 👨‍🏫 AI Teacher
        </div>


        <!-- CHAT -->

        <div
            class="chat"
            id="chat"
        >

            <div
                class="welcome"
                id="welcome"
            >
                👋 Start a conversation with your AI
            </div>

        </div>


        <!-- INPUT -->

        <div class="input-area">

            <input
                id="messageInput"
                type="text"
                placeholder="Type your message..."
                autocomplete="off"
            >


            <button
                id="send"
                onclick="sendMessage()"
            >
                Send
            </button>

        </div>

    </main>

</div>


<script>

    /* ================= STATE ================= */

    let currentMode = "you are an ai teacher";

    let history = [];


    /* ================= MODE NAMES ================= */

    const modeNames = {

        "you are an ai teacher":
            "👨‍🏫 AI Teacher",

        "you are a friend":
            "🤝 Friend",

        "you are an angry person":
            "😡 Angry Person",

        "you are a sad person":
            "😢 Sad Person"

    };


    /* ================= SELECT MODE ================= */

    function selectMode(button, mode) {

        currentMode = mode;

        history = [];


        const chat =
            document.getElementById("chat");


        chat.innerHTML = `

            <div
                class="welcome"
                id="welcome"
            >
                👋 Start a conversation with your AI
            </div>

        `;


        document
            .querySelectorAll(".persona")
            .forEach(btn => {

                btn.classList.remove("active");

            });


        button.classList.add("active");


        document
            .getElementById("currentMode")
            .innerText =
                "Current Mode: " +
                modeNames[mode];

    }


    /* ================= ADD MESSAGE ================= */

    function addMessage(type, text) {

        const chat =
            document.getElementById("chat");


        const welcome =
            document.getElementById("welcome");


        if (welcome) {

            welcome.remove();

        }


        const message =
            document.createElement("div");


        message.className =
            "message " + type;


        const name =
            document.createElement("div");


        name.className = "name";


        name.innerText =
            type === "user"
                ? "YOU"
                : "AI";


        const content =
            document.createElement("div");


        content.innerText = text;


        message.appendChild(name);

        message.appendChild(content);


        chat.appendChild(message);


        chat.scrollTop =
            chat.scrollHeight;

    }


    /* ================= SEND MESSAGE ================= */

    async function sendMessage() {

        const input =
            document.getElementById(
                "messageInput"
            );


        const sendButton =
            document.getElementById("send");


        const message =
            input.value.trim();


        if (!message) {

            return;

        }


        /* Show user message */

        addMessage(
            "user",
            message
        );


        input.value = "";


        sendButton.disabled = true;

        sendButton.innerText =
            "Thinking...";


        try {

            const response =
                await fetch(
                    "/api/chat",
                    {

                        method: "POST",

                        headers: {

                            "Content-Type":
                                "application/json"

                        },

                        body: JSON.stringify({

                            message:
                                message,

                            mode:
                                currentMode,

                            history:
                                history

                        })

                    }
                );


            const data =
                await response.json();


            if (!response.ok) {

                throw new Error(

                    data.detail ||
                    "Server error"

                );

            }


            /* Show AI response */

            addMessage(
                "bot",
                data.response
            );


            /* Save conversation */

            history.push({

                role: "user",

                content: message

            });


            history.push({

                role: "assistant",

                content: data.response

            });


        }

        catch (error) {

            console.error(error);


            addMessage(

                "bot",

                "❌ Error: " +
                error.message

            );

        }


        sendButton.disabled = false;

        sendButton.innerText =
            "Send";


        input.focus();

    }


    /* ================= CLEAR CHAT ================= */

    function clearChat() {

        history = [];


        document.getElementById(
            "chat"
        ).innerHTML = `

            <div
                class="welcome"
                id="welcome"
            >
                👋 Start a conversation with your AI
            </div>

        `;

    }


    /* ================= ENTER KEY ================= */

    document
        .getElementById("messageInput")
        .addEventListener(
            "keydown",
            function(event) {

                if (event.key === "Enter") {

                    sendMessage();

                }

            }
        );

</script>

</body>

</html>
